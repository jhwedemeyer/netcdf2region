[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netcdf2region"
version = "0.1.9"
description = "Aggregate NetCDF data to regions using spatial weights"
authors = [{ name = "Jakob Wedemeyer", email = "jakob.wedemeyer@pik-potsdam.de" }]
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "geopandas",
    "shapely",
    "joblib",
    "tqdm",
    "netcdf4"
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[project.scripts]
compute_grid_weights = "netcdf2region.compute_grid_weights:main"
netcdf2region = "netcdf2region.aggregate:main"
validate_weights = "netcdf2region.validate_weights:main"

[tool.setuptools.packages.find]
include = ["netcdf2region*"]

[tool.setuptools.package-data]
"netcdf2region" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the working tree ahead of any installed netcdf2region, so the suite always
# tests the code in this checkout rather than a stale copy in site-packages.
pythonpath = ["."]
markers = [
    "cluster: needs the PIK /p/projects input data; skipped elsewhere",
    "slow: takes more than a moment (reads the full shipped weights)",
]
addopts = "-ra --strict-markers -m 'not cluster'"